# Download script/URL — val2017 images ONLY. Deliberately does NOT include
# train2017.zip (~19GB) or test2017.zip (~7GB), which Ultralytics' own
# coco.yaml pulls unconditionally and this eval harness never needs.
download: |
  from pathlib import Path
  from ultralytics.utils.downloads import download

  dir = Path(yaml["path"])  # dataset root dir

  # Labels (box + segment labels for all splits, same zip coco.yaml uses).
  # Skip if already present to avoid re-downloading ~169MB unnecessarily.
  if not (dir / "labels" / "val2017").exists():
      url = "https://github.com/ultralytics/assets/releases/download/v0.0.0/"
      download([url + "coco2017labels-segments.zip"], dir=dir.parent)

  # Images — val2017 ONLY (~1GB, 5000 images).
  download(
      ["http://images.cocodataset.org/zips/val2017.zip"],
      dir=dir / "images",
      delete=True,
  )

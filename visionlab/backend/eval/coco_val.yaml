# VisionLab eval — COCO val2017-ONLY dataset config, used by `eval.detection --full`.
#
# Ultralytics' bundled coco.yaml downloads train2017 (~19GB) + val2017 (~1GB)
# + test2017 (~7GB) unconditionally — ~26GB — even though a validation-only
# run (eval.detection.py always validates, never trains) only ever reads the
# 'val' split. This file is the same COCO 2017 dataset (same 80 classes,
# same label format) with the download step trimmed to val2017 only.
#
# Note: eval/detection.py does its own pre-flight check before invoking the
# validator (see `_ensure_coco_val_ready()`) rather than relying solely on
# Ultralytics' own auto-download trigger here — Ultralytics only checks that
# the 'val' path (val2017.txt) *exists*, not that the images it lists exist,
# so a previously-interrupted download can leave that check silently
# satisfied while images/val2017/ is actually empty. The `download:` script
# below still makes this yaml correct and self-sufficient if used directly
# (e.g. `yolo val data=coco_val.yaml`) outside our script.

path: coco  # resolves to <ultralytics datasets_dir>/coco (e.g. /app/datasets/coco)

# 'train:' is required by Ultralytics' dataset schema even though this file
# is only ever used for validation. It points at the label manifest, not
# images — no train images are downloaded or read.
train: train2017.txt
val: val2017.txt  # val images (relative to 'path') — 5000 images

# Classes — identical to Ultralytics' coco.yaml.

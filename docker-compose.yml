services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: visionlab
      POSTGRES_PASSWORD: visionlab
      POSTGRES_DB: visionlab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visionlab"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    image: visionlab-backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://visionlab:visionlab@postgres:5432/visionlab
      SYNC_DATABASE_URL: postgresql://visionlab:visionlab@postgres:5432/visionlab
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8001:8000"
    volumes:
      - ./audio_outputs:/app/audio_outputs
      - ./image_outputs:/app/image_outputs
      - hf_cache:/app/models
      - yolo_cache:/app/.yolo_cache
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: .
    image: visionlab-backend
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "-Ofair"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://visionlab:visionlab@postgres:5432/visionlab
      SYNC_DATABASE_URL: postgresql://visionlab:visionlab@postgres:5432/visionlab
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./audio_outputs:/app/audio_outputs
      - ./image_outputs:/app/image_outputs
      - hf_cache:/app/models
      - yolo_cache:/app/.yolo_cache
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }

  flower:
    image: visionlab-backend
    command: ["celery", "-A", "app.tasks.celery_app", "flower", "--port=5555"]
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "5555:5555"
    depends_on:
      redis: { condition: service_healthy }
      worker: { condition: service_started }

volumes:
  postgres_data:
  hf_cache:
  yolo_cache:
